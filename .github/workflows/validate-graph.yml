name: validate / graph

on:
  pull_request:
    paths:
      - "apps/python-app/libs/cssc_graph/**"
      - "apps/python-app/services/graph-service/**"
      - "supply-chain-graph/**"
      - ".github/workflows/validate-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install declared graph test dependencies
        run: |
          python -m pip install -e 'apps/python-app/libs/cssc_graph[test]' \
            -e 'apps/python-app/services/graph-service[test]'
      - name: Require the real graph engine and run library and HTTP tests
        run: |
          python -c 'import ladybug; print("Native LadybugDB engine available")'
          python -m pytest --import-mode=importlib -q \
            apps/python-app/libs/cssc_graph/tests \
            apps/python-app/services/graph-service/tests
      - name: Validate committed example schemas
        run: cssc-graph validate supply-chain-graph
