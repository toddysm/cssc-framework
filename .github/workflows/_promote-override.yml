# Reusable workflow: act on a manual promotion-override decision.
#
# This workflow is internal (note the leading underscore) and is called by the
# `promote-override.yml` caller via `uses:`. It performs the override decision
# for one quarantined image+tag whose promotion was blocked by the vulnerability
# gate and is being approved or denied by a maintainer.
#
# Flow:
#   1. verify-approver  — confirm the approver has sufficient repo permission.
#   2. manage-issue get — recover the promotion metadata recorded on the issue.
#   3. approve: mirror-image (force) -> attach-scan-report (override annotations)
#      -> delete-image (optional) -> manage-issue close (promotion-approved)
#      -> notify-slack (approved).
#   4. deny: manage-issue close (promotion-denied) -> notify-slack (denied).
#
# Terminology and the action catalogue: see docs/reference/workflow-actions.md.
# See also docs/architecture/catalog/promote-from-quarantine-override-approval.md.
name: _reusable / promote-override

on:
  workflow_call:
    inputs:
      issue_number:
        description: "Tracking-issue number carrying the promotion metadata."
        required: true
        type: string
      decision:
        description: "approve | deny."
        required: true
        type: string
      approver:
        description: "Login that issued the decision."
        required: true
        type: string
      min_permission:
        description: "Minimum repo permission required to approve: admin | maintain | write."
        required: false
        default: maintain
        type: string
      delete_source:
        description: "Delete the tag from quarantine after a successful override promotion."
        required: false
        default: true
        type: boolean
      trivy_version:
        description: "Trivy version to install; also recorded in the referrer when missing from metadata."
        required: false
        default: v0.71.0
        type: string
    secrets:
      ghcr_delete_token:
        description: "PAT with delete:packages used to remove the quarantine tag. Optional."
        required: false
      slack_webhook:
        description: "Slack incoming webhook URL for the decision notification. Optional."
        required: false

jobs:
  override:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write
    env:
      DECISION: "${{ inputs.decision }}"
      APPROVER: "${{ inputs.approver }}"
      ISSUE_NUMBER: "${{ inputs.issue_number }}"
    steps:
      - name: Validate decision
        run: |
          set -euo pipefail
          case "${DECISION}" in
            approve|deny) : ;;
            *) echo "::error::Invalid decision '${DECISION}' (expected approve|deny)"; exit 1 ;;
          esac

      - name: Check out actions
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # An approval bypasses the security gate, so the approver must hold a
      # sufficient repository role. A denial is harmless and does not require it.
      - name: Verify approver
        if: inputs.decision == 'approve'
        uses: ./.github/actions/verify-approver
        with:
          actor: ${{ inputs.approver }}
          min-permission: ${{ inputs.min_permission }}
          token: ${{ github.token }}

      - name: Read promotion metadata
        id: issue
        uses: ./.github/actions/manage-issue
        with:
          operation: get
          image: "unused"
          tag: "unused"
          issue-number: ${{ inputs.issue_number }}
          token: ${{ github.token }}

      # Unpack the recovered JSON metadata into step outputs the later steps use.
      - name: Parse metadata
        id: meta
        env:
          METADATA_JSON: "${{ steps.issue.outputs.metadata-json }}"
        run: |
          set -euo pipefail
          export LC_ALL=C

          if [ -z "${METADATA_JSON}" ] || ! printf '%s' "${METADATA_JSON}" | jq -e . >/dev/null 2>&1; then
            echo "::error::No valid promotion metadata found on issue #${ISSUE_NUMBER}."
            exit 1
          fi

          get () { printf '%s' "${METADATA_JSON}" | jq -r "$1 // empty"; }

          {
            echo "source-repo=$(get '.source_repo')"
            echo "dest-repo=$(get '.dest_repo')"
            echo "tag=$(get '.tag')"
            echo "threshold=$(get '.threshold')"
            echo "method=$(get '.method')"
            echo "scanner-version=$(get '.scanner_version')"
            # Pipe-join the blocking CVE array for the referrer annotation.
            echo "cves=$(printf '%s' "${METADATA_JSON}" | jq -r '(.blocking_cves // []) | join("|")')"
            # Always carry referrers (SBOM/provenance/VEX/signatures) with the
            # promoted image so golden holds the complete attestation set.
            echo "copy-referrers=true"
          }  >> "${GITHUB_OUTPUT}"

      - name: Set up crane
        if: inputs.decision == 'approve'
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - name: Set up oras
        if: inputs.decision == 'approve'
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0
        with:
          version: 1.3.1

      - name: Log in to GHCR
        if: inputs.decision == 'approve'
        uses: ./.github/actions/registry-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          with-oras: "true"

      # Make approval idempotent: a duplicate or stale /approve (the image was
      # already promoted out of quarantine) must not hard-fail on a missing
      # source. Classify the state before copying.
      - name: Preflight override
        id: preflight
        if: inputs.decision == 'approve'
        env:
          SOURCE_REF: "${{ steps.meta.outputs.source-repo }}:${{ steps.meta.outputs.tag }}"
          DEST_REF: "${{ steps.meta.outputs.dest-repo }}:${{ steps.meta.outputs.tag }}"
        run: |
          set -euo pipefail
          exists() { crane manifest "$1" >/dev/null 2>&1; }
          if exists "${SOURCE_REF}"; then
            state=promote
            echo "Source ${SOURCE_REF} is present; promoting."
          elif exists "${DEST_REF}"; then
            state=already-promoted
            echo "::notice::${SOURCE_REF} is gone but ${DEST_REF} already exists; treating this approval as already promoted (idempotent no-op)."
          else
            echo "::error::Nothing to promote: ${SOURCE_REF} is not in quarantine and ${DEST_REF} is not in the destination."
            exit 1
          fi
          echo "state=${state}" >> "${GITHUB_OUTPUT}"

      # --- Approve path: promote despite the gate, record the override. --------
      - name: Promote overridden image
        id: promote
        if: inputs.decision == 'approve' && steps.preflight.outputs.state == 'promote'
        uses: ./.github/actions/mirror-image
        with:
          source-image: ${{ steps.meta.outputs.source-repo }}
          source-tag: ${{ steps.meta.outputs.tag }}
          dest-image: ${{ steps.meta.outputs.dest-repo }}
          dest-tag: ${{ steps.meta.outputs.tag }}
          force: "true"
          copy-referrers: ${{ steps.meta.outputs.copy-referrers }}

      # Record the override promotion in the supply-chain graph, mirroring the
      # automated promote path. Single job, so one `graph-events` artifact.
      - name: Stage promotion graph event
        if: inputs.decision == 'approve' && steps.promote.outputs.digest != ''
        uses: ./.github/actions/build-graph-event
        with:
          kind: ArtifactPromoted
          source-ref: ${{ steps.meta.outputs.source-repo }}
          source-digest: ${{ steps.promote.outputs.digest }}
          dest-ref: ${{ steps.meta.outputs.dest-repo }}
          dest-digest: ${{ steps.promote.outputs.digest }}
          tag: ${{ steps.meta.outputs.tag }}
          evidence-issue-url: ${{ steps.issue.outputs.issue-url }}
          output-dir: ${{ runner.temp }}/graph-events
          workflow: ${{ github.workflow }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}

      - name: Stage tag observation graph event
        if: inputs.decision == 'approve' && steps.promote.outputs.digest != ''
        uses: ./.github/actions/build-graph-event
        with:
          kind: TagObserved
          dest-ref: ${{ steps.meta.outputs.dest-repo }}
          dest-digest: ${{ steps.promote.outputs.digest }}
          tag: ${{ steps.meta.outputs.tag }}
          output-dir: ${{ runner.temp }}/graph-events
          workflow: ${{ github.workflow }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}

      - name: Stage referrer graph events
        if: inputs.decision == 'approve' && steps.promote.outputs.digest != ''
        uses: ./.github/actions/stage-referrer-events
        with:
          ref: ${{ steps.meta.outputs.dest-repo }}
          digest: ${{ steps.promote.outputs.digest }}
          tag: ${{ steps.meta.outputs.tag }}
          output-dir: ${{ runner.temp }}/graph-events
          workflow: ${{ github.workflow }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}

      - name: Upload graph events
        if: inputs.decision == 'approve' && steps.promote.outputs.digest != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-events
          path: ${{ runner.temp }}/graph-events
          if-no-files-found: ignore
          retention-days: 1

      # The override path runs no fresh scan, so synthesize the in-toto vuln
      # attestation (subject = promoted image) documenting the approved exception
      # from the recorded metadata, for attach-scan-report to publish.
      - name: Build override vulnerability attestation
        id: attestation
        if: inputs.decision == 'approve' && steps.promote.outputs.digest != ''
        env:
          DEST_REPO: "${{ steps.meta.outputs.dest-repo }}"
          DEST_DIGEST: "${{ steps.promote.outputs.digest }}"
          APPROVER: "${{ inputs.approver }}"
          ISSUE_URL: "${{ steps.issue.outputs.issue-url }}"
          OVERRIDE_CVES: "${{ steps.meta.outputs.cves }}"
        run: |
          set -euo pipefail
          export LC_ALL=C

          work="$(mktemp -d)"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cves="$(printf '%s' "${OVERRIDE_CVES}" | jq -R 'split("|") | map(select(length > 0))')"

          pred="${work}/override-vuln.json"
          jq -n --arg now "${now}" --arg approver "${APPROVER}" --arg issue "${ISSUE_URL}" --argjson cves "${cves}" '{
            scanner: {name: "cssc-override", version: "n/a"},
            metadata: {scanStartedAt: $now, scanFinishedAt: $now},
            override: {approved: true, approver: $approver, issue: $issue, cves: $cves}
          }' > "${pred}"

          # Subject digest is the just-promoted digest from mirror-image (no
          # extra registry round trip, no tag-drift risk).
          algo="${DEST_DIGEST%%:*}"; hexv="${DEST_DIGEST#*:}"
          att="${work}/override-attestation.json"
          jq -n --arg name "${DEST_REPO}" --arg algo "${algo}" --arg hexv "${hexv}" --slurpfile pred "${pred}" '{
            _type: "https://in-toto.io/Statement/v1",
            subject: [ { name: $name, digest: { ($algo): $hexv } } ],
            predicateType: "https://cosign.sigstore.dev/attestation/vuln/v1",
            predicate: $pred[0]
          }' > "${att}"
          echo "path=${att}" >> "${GITHUB_OUTPUT}"

      - name: Attach scan-report attestation
        if: inputs.decision == 'approve' && steps.promote.outputs.digest != ''
        uses: ./.github/actions/attach-scan-report
        with:
          image-ref: ${{ steps.meta.outputs.dest-repo }}:${{ steps.meta.outputs.tag }}
          attestation-file: ${{ steps.attestation.outputs.path }}
          source-repo: ${{ steps.meta.outputs.source-repo }}
          tag: ${{ steps.meta.outputs.tag }}
          threshold: ${{ steps.meta.outputs.threshold }}
          scanner-version: ${{ steps.meta.outputs.scanner-version }}
          method: ${{ steps.meta.outputs.method }}
          override: "true"
          override-approver: ${{ inputs.approver }}
          override-issue: ${{ steps.issue.outputs.issue-url }}
          override-cves: ${{ steps.meta.outputs.cves }}

      - name: Delete overridden tag from quarantine
        if: inputs.decision == 'approve' && inputs.delete_source && steps.promote.outputs.digest != ''
        uses: ./.github/actions/delete-image
        with:
          repository: ${{ steps.meta.outputs.source-repo }}
          tag: ${{ steps.meta.outputs.tag }}
          token: ${{ secrets.ghcr_delete_token }}

      # Close + notify once the promotion itself has succeeded, regardless of
      # the optional quarantine-delete outcome (best-effort cleanup must not
      # leave the tracking issue open after a successful override promotion).
      - name: Close issue as approved
        if: always() && inputs.decision == 'approve' && (steps.promote.conclusion == 'success' || steps.preflight.outputs.state == 'already-promoted')
        uses: ./.github/actions/manage-issue
        with:
          operation: close
          image: ${{ steps.meta.outputs.source-repo }}
          tag: ${{ steps.meta.outputs.tag }}
          issue-number: ${{ inputs.issue_number }}
          outcome: promotion-approved
          body: "Override **approved** by @${{ inputs.approver }}. `${{ steps.meta.outputs.dest-repo }}:${{ steps.meta.outputs.tag }}` is promoted to the golden repository despite the failing gate. ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
          token: ${{ github.token }}

      - name: Notify Slack of approval
        if: always() && inputs.decision == 'approve' && (steps.promote.conclusion == 'success' || steps.preflight.outputs.state == 'already-promoted')
        uses: ./.github/actions/notify-slack
        with:
          webhook-url: ${{ secrets.slack_webhook }}
          status: approved
          image: ${{ steps.meta.outputs.source-repo }}
          tag: ${{ steps.meta.outputs.tag }}
          threshold: ${{ steps.meta.outputs.threshold }}
          blocking-cves: ${{ steps.meta.outputs.cves }}
          issue-url: ${{ steps.issue.outputs.issue-url }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          approver: ${{ inputs.approver }}

      # --- Deny path: no promotion; close and notify. --------------------------
      - name: Close issue as denied
        if: inputs.decision == 'deny'
        uses: ./.github/actions/manage-issue
        with:
          operation: close
          image: ${{ steps.meta.outputs.source-repo }}
          tag: ${{ steps.meta.outputs.tag }}
          issue-number: ${{ inputs.issue_number }}
          outcome: promotion-denied
          body: "Override **denied** by @${{ inputs.approver }}. `${{ steps.meta.outputs.source-repo }}:${{ steps.meta.outputs.tag }}` stays in quarantine."
          token: ${{ github.token }}

      - name: Notify Slack of denial
        if: inputs.decision == 'deny'
        uses: ./.github/actions/notify-slack
        with:
          webhook-url: ${{ secrets.slack_webhook }}
          status: denied
          image: ${{ steps.meta.outputs.source-repo }}
          tag: ${{ steps.meta.outputs.tag }}
          threshold: ${{ steps.meta.outputs.threshold }}
          blocking-cves: ${{ steps.meta.outputs.cves }}
          issue-url: ${{ steps.issue.outputs.issue-url }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          approver: ${{ inputs.approver }}
