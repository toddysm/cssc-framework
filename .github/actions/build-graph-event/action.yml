# Composite action: build-graph-event
#
# Write a supply-chain-graph event record (JSON) into a staging directory so a
# downstream collector can commit it to the `supply-chain-graph-data` branch.
# This action never commits or pushes and needs no extra permissions — the
# producer workflows (mirror / promote) call it and upload the staging directory
# as a workflow artifact; the record-graph-events workflow does the committing.
#
# Records conform to the schemas under supply-chain-graph/schema/. JSON is a
# subset of YAML, so the indexer/validator (which accept .json) read them as-is.
#
# Idempotency: the record carries a deterministic `id` — the sha256 content id
# of its semantic payload (the whole record minus the volatile envelope fields
# id/recordedAt/source), computed exactly as cssc_graph.identity.content_id — and
# the file is named after that full hash. Re-recording the same fact yields the
# same id and path. The collector only ever *adds* new files (never overwrites),
# keeping the ledger immutable and re-runs a no-op.
#
# Design: docs/architecture/observability/supply-chain-graph.md.
name: build-graph-event
description: Stage a supply-chain-graph event record (ArtifactMirrored / ArtifactPromoted / TagObserved) as JSON.

inputs:
  kind:
    description: "Record kind: ArtifactMirrored, ArtifactPromoted, or TagObserved."
    required: true
  source-ref:
    description: "Fully-qualified source name registry/repository (from occurrence). Required for ArtifactMirrored/ArtifactPromoted."
    required: false
    default: ""
  source-digest:
    description: "Source digest (sha256:...). Required for ArtifactMirrored/ArtifactPromoted."
    required: false
    default: ""
  dest-ref:
    description: "Fully-qualified destination name registry/repository (to occurrence, or the tag's occurrence for TagObserved)."
    required: true
  dest-digest:
    description: "Destination digest (sha256:...). For TagObserved this is the digest the tag points to."
    required: true
  tag:
    description: "Image tag."
    required: true
  force:
    description: "'true' when a mirror was a force copy (ArtifactMirrored only)."
    required: false
    default: "false"
  output-dir:
    description: "Staging directory to write the event file into."
    required: false
    default: ""
  workflow:
    description: "Producing workflow name (source.workflow)."
    required: true
  run-url:
    description: "URL of the producing run (source.runUrl)."
    required: true
  run-id:
    description: "Producing run id (source.runId)."
    required: true
  run-attempt:
    description: "Producing run attempt (source.runAttempt)."
    required: true

runs:
  using: composite
  steps:
    - name: Stage ${{ inputs.kind }} event
      shell: bash
      env:
        KIND: "${{ inputs.kind }}"
        SOURCE_REF: "${{ inputs.source-ref }}"
        SOURCE_DIGEST: "${{ inputs.source-digest }}"
        DEST_REF: "${{ inputs.dest-ref }}"
        DEST_DIGEST: "${{ inputs.dest-digest }}"
        TAG: "${{ inputs.tag }}"
        FORCE: "${{ inputs.force }}"
        OUTPUT_DIR: "${{ inputs.output-dir }}"
        WORKFLOW: "${{ inputs.workflow }}"
        RUN_URL: "${{ inputs.run-url }}"
        RUN_ID: "${{ inputs.run-id }}"
        RUN_ATTEMPT: "${{ inputs.run-attempt }}"
        RUNNER_TEMP_DIR: "${{ runner.temp }}"
      run: |
        set -euo pipefail

        outdir="${OUTPUT_DIR:-${RUNNER_TEMP_DIR}/graph-events}"
        now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        # Split a fully-qualified name into registry (first path component, which
        # carries the login server) and repository (the rest).
        split_ref() {
          local ref="$1"
          if [ "${ref%%/*}" = "${ref}" ] || [ -z "${ref#*/}" ]; then
            echo "::error::build-graph-event: not a fully-qualified ref: '${ref}'"
            exit 1
          fi
          REG="${ref%%/*}"
          REPO="${ref#*/}"
        }

        source_json="$(jq -nc \
          --arg w "${WORKFLOW}" --arg u "${RUN_URL}" \
          --arg rid "${RUN_ID}" --arg ra "${RUN_ATTEMPT}" \
          '{type:"github-actions", workflow:$w, runUrl:$u, runId:$rid, runAttempt:$ra}')"

        case "${KIND}" in
          ArtifactMirrored|ArtifactPromoted)
            [ -n "${SOURCE_REF}" ] && [ -n "${SOURCE_DIGEST}" ] || {
              echo "::error::build-graph-event: ${KIND} requires source-ref and source-digest."; exit 1; }
            split_ref "${SOURCE_REF}"; s_reg="${REG}"; s_repo="${REPO}"
            split_ref "${DEST_REF}";   d_reg="${REG}"; d_repo="${REPO}"
            record="$(jq -nc \
              --argjson src "${source_json}" --arg now "${now}" --arg kind "${KIND}" \
              --arg sreg "${s_reg}" --arg srepo "${s_repo}" --arg sdig "${SOURCE_DIGEST}" \
              --arg dreg "${d_reg}" --arg drepo "${d_repo}" --arg ddig "${DEST_DIGEST}" \
              --arg tag "${TAG}" \
              '{schemaVersion:1, kind:$kind, recordedAt:$now, source:$src,
                from:{registry:$sreg, repository:$srepo, digest:$sdig},
                to:{registry:$dreg, repository:$drepo, digest:$ddig},
                tag:$tag}')"
            if [ "${KIND}" = "ArtifactMirrored" ] && [ "${FORCE}" = "true" ]; then
              record="$(printf '%s' "${record}" | jq -c '. + {force:true}')"
            fi
            ;;
          TagObserved)
            split_ref "${DEST_REF}"; d_reg="${REG}"; d_repo="${REPO}"
            record="$(jq -nc \
              --argjson src "${source_json}" --arg now "${now}" \
              --arg dreg "${d_reg}" --arg drepo "${d_repo}" \
              --arg dig "${DEST_DIGEST}" --arg tag "${TAG}" \
              '{schemaVersion:1, kind:"TagObserved", recordedAt:$now, source:$src,
                occurrence:{registry:$dreg, repository:$drepo},
                tag:$tag, digest:$dig, observedAt:$now}')"
            ;;
          *)
            echo "::error::build-graph-event: unknown kind '${KIND}'."
            exit 1
            ;;
        esac

        # Content id = sha256 over the record's canonical semantic payload (the
        # record minus the volatile envelope fields id/recordedAt/source), matching
        # cssc_graph.identity.content_id: sorted keys, compact separators, no
        # trailing newline (jq -S -c -j). Store it in `id` and use the full hash as
        # the filename so collisions are effectively impossible.
        hex="$(printf '%s' "${record}" | jq -S -c -j 'del(.id, .recordedAt, .source)' | sha256sum | cut -d' ' -f1)"
        record="$(printf '%s' "${record}" | jq -c --arg id "sha256:${hex}" '. + {id: $id}')"
        kdir="$(printf '%s' "${KIND}" | sed -E 's/([a-z0-9])([A-Z])/\1-\2/g' | tr '[:upper:]' '[:lower:]')"
        dir="${outdir}/events/${kdir}"
        mkdir -p "${dir}"
        printf '%s\n' "${record}" | jq . > "${dir}/${hex}.json"
        echo "Staged ${KIND} event: events/${kdir}/${hex}.json"
