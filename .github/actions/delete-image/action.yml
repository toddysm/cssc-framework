# Composite action: delete-image
#
# Delete one tag from a GHCR repository via the GitHub Packages REST API. The
# built-in GITHUB_TOKEN can push and pull but cannot delete package versions, so
# a PAT carrying `delete:packages` is required. Used to remove a tag from
# quarantine after it has been promoted.
#
# When `delete-referrers` is set (default), the tag's referrer closure is removed
# first: every OCI 1.1 referrer manifest (untagged package version, resolved by
# digest) and OCI 1.0 `sha256-<subject-digest>` fallback referrer index, for the
# image index and each per-platform child manifest, discovered recursively so
# referrers-of-referrers are included. This requires crane/oras to be logged in
# to the registry (the promote jobs already are); it degrades to image-only
# deletion otherwise. Referrer cleanup is best-effort and never fails the caller.
#
# Resolves the owner type (user vs organization) and the package-version id for
# the tag, then issues the delete. When the tag is the package's last tagged
# version (which GHCR refuses to delete via the versions API), it falls back to
# deleting the whole package. Emits a status the caller can surface:
# deleted | skipped | failed.
#
# Terminology: see docs/reference/workflow-actions.md.
name: delete-image
description: Delete one tag (and its referrer closure) from a GHCR repository via the Packages REST API.

inputs:
  repository:
    description: "GHCR repository the tag lives in, without tag (e.g. ghcr.io/owner/quarantine/python)."
    required: true
  tag:
    description: "Tag to delete."
    required: true
  token:
    description: "PAT with delete:packages. When empty, deletion is skipped with a warning."
    required: false
    default: ""
  delete-referrers:
    description: "Also delete the image's referrer closure (OCI 1.1 manifests + sha256-* fallback tags, recursively). Requires crane/oras to be logged in to the registry."
    required: false
    default: "true"

outputs:
  status:
    description: "deleted | skipped | failed."
    value: ${{ steps.delete.outputs.status }}
  referrers-deleted:
    description: "Number of referrer artifacts (manifests + fallback tags) removed from the repository."
    value: ${{ steps.delete.outputs.referrers-deleted }}

runs:
  using: composite
  steps:
    - name: Delete ${{ inputs.repository }}:${{ inputs.tag }}
      id: delete
      shell: bash
      env:
        REPOSITORY: "${{ inputs.repository }}"
        TAG: "${{ inputs.tag }}"
        DELETE_TOKEN: "${{ inputs.token }}"
        DELETE_REFERRERS: "${{ inputs.delete-referrers }}"
      run: |
        set -euo pipefail
        export LC_ALL=C

        if [ -z "${DELETE_TOKEN}" ]; then
          echo "::warning::No delete token provided; skipping deletion of ${REPOSITORY}:${TAG}."
          echo "status=skipped" >> "${GITHUB_OUTPUT}"
          echo "referrers-deleted=0" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        # Work out the GHCR package coordinates: owner, encoded package path, and
        # whether the owner is a user or an organization (different API base).
        owner="$(printf '%s' "${REPOSITORY}" | awk -F/ '{print $2}')"
        pkg_path="$(printf '%s' "${REPOSITORY}" | cut -d/ -f3-)"
        pkg_enc="$(printf '%s' "${pkg_path}" | sed 's:/:%2F:g')"
        owner_type="$(GH_TOKEN="${DELETE_TOKEN}" gh api "users/${owner}" --jq '.type' 2>/dev/null || true)"

        if [ "${owner_type}" = "Organization" ]; then
          base="orgs/${owner}/packages/container/${pkg_enc}"
        else
          base="user/packages/container/${pkg_enc}"
        fi

        # Snapshot every package version once (id + digest name + tags). Referrer
        # manifests are untagged versions keyed by their digest (.name); OCI 1.0
        # fallback referrer indexes are tagged sha256-<subject-digest>.
        versions="$(GH_TOKEN="${DELETE_TOKEN}" gh api --paginate "${base}/versions" 2>/dev/null || echo '[]')"
        id_for_digest() { printf '%s' "${versions}" | jq -r --arg d "$1" 'map(select(.name == $d)) | .[0].id // empty'; }
        id_for_tag()    { printf '%s' "${versions}" | jq -r --arg t "$1" 'map(select(.metadata.container.tags[]? == $t)) | .[0].id // empty'; }

        referrers_deleted=0

        # --- Delete the referrer closure before the image itself. ---------------
        # Deletion runs last in the promotion, so the image + referrers still
        # exist here and can be enumerated. This is best-effort: any failure only
        # warns (a completed promotion must not be failed by cleanup), and it is
        # a no-op when crane/oras are not logged in.
        if [ "${DELETE_REFERRERS}" = "true" ] && command -v crane >/dev/null 2>&1; then
          subject_digest="$(crane digest "${REPOSITORY}:${TAG}" 2>/dev/null || true)"
          if [ -z "${subject_digest}" ]; then
            echo "::notice::Could not resolve a digest for ${REPOSITORY}:${TAG}; skipping referrer cleanup."
          else
            # Subjects = the image index plus every per-platform child manifest.
            children="$(crane manifest "${REPOSITORY}@${subject_digest}" 2>/dev/null | jq -r '.manifests[]?.digest // empty' 2>/dev/null || true)"
            subjects="$(printf '%s\n%s\n' "${subject_digest}" "${children}" | sed '/^$/d' | sort -u)"

            # Walk the referrer graph with a worklist so referrers-of-referrers
            # (e.g. a signature on an SBOM) are included. oras JSON nesting varies
            # by version, so collect any object carrying both artifactType+digest.
            processed=""
            pending="${subjects}"
            referrer_digests=""
            if command -v oras >/dev/null 2>&1; then
              while [ -n "$(printf '%s' "${pending}" | sed '/^$/d')" ]; do
                subj="$(printf '%s\n' "${pending}" | sed '/^$/d' | head -n1)"
                pending="$(printf '%s\n' "${pending}" | sed '/^$/d' | grep -vxF "${subj}" || true)"
                printf '%s\n' "${processed}" | grep -qxF "${subj}" && continue
                processed="$(printf '%s\n%s\n' "${processed}" "${subj}" | sed '/^$/d')"
                refs="$(oras discover --format json "${REPOSITORY}@${subj}" 2>/dev/null \
                  | jq -r '[.. | objects | select(has("artifactType") and has("digest")) | .digest] | unique | .[]' 2>/dev/null || true)"
                for r in ${refs}; do
                  referrer_digests="$(printf '%s\n%s\n' "${referrer_digests}" "${r}" | sed '/^$/d')"
                  printf '%s\n' "${processed}" | grep -qxF "${r}" || pending="$(printf '%s\n%s\n' "${pending}" "${r}" | sed '/^$/d')"
                done
              done
            fi

            # Delete referrer manifests (untagged versions, keyed by digest).
            for r in $(printf '%s\n' "${referrer_digests}" | sed '/^$/d' | sort -u); do
              rid="$(id_for_digest "${r}")"
              [ -n "${rid}" ] || continue
              if GH_TOKEN="${DELETE_TOKEN}" gh api -X DELETE "${base}/versions/${rid}" >/dev/null 2>&1; then
                echo "Deleted referrer ${r} (version ${rid})."
                referrers_deleted=$((referrers_deleted + 1))
              else
                echo "::warning::Failed to delete referrer ${r} (version ${rid}); leaving it in place."
              fi
            done

            # Delete OCI 1.0 fallback referrer indexes (sha256-<subject-digest>).
            for s in ${subjects}; do
              fb="$(printf '%s' "${s}" | sed 's/:/-/')"
              fid="$(id_for_tag "${fb}")"
              [ -n "${fid}" ] || continue
              if GH_TOKEN="${DELETE_TOKEN}" gh api -X DELETE "${base}/versions/${fid}" >/dev/null 2>&1; then
                echo "Deleted fallback referrer tag ${fb} (version ${fid})."
                referrers_deleted=$((referrers_deleted + 1))
              else
                echo "::warning::Failed to delete fallback referrer tag ${fb} (version ${fid}); leaving it in place."
              fi
            done
          fi
        fi
        echo "referrers-deleted=${referrers_deleted}" >> "${GITHUB_OUTPUT}"

        # --- Delete the image tag itself. ---------------------------------------
        vid="$(id_for_tag "${TAG}")"
        if [ -z "${vid}" ]; then
          echo "::warning::Could not resolve a package version id for tag '${TAG}'; skipping deletion."
          echo "status=failed" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        # Deletion is best-effort cleanup: a failure here must not fail the
        # promotion that already succeeded. Capture the error, and:
        #   - if GHCR refuses because this is the last tagged version of the
        #     package (HTTP 400), delete the whole package instead — emptying the
        #     quarantine package is the intended cleanup once its only image was
        #     promoted;
        #   - otherwise warn and report status=failed instead of aborting.
        if err="$(GH_TOKEN="${DELETE_TOKEN}" gh api -X DELETE "${base}/versions/${vid}" 2>&1 >/dev/null)"; then
          echo "Deleted ${REPOSITORY}:${TAG} (version ${vid})."
          echo "status=deleted" >> "${GITHUB_OUTPUT}"
        elif printf '%s' "${err}" | grep -qiF "last tagged version"; then
          echo "::notice::'${TAG}' is the last tagged version of ${REPOSITORY}; deleting the whole package instead."
          if perr="$(GH_TOKEN="${DELETE_TOKEN}" gh api -X DELETE "${base}" 2>&1 >/dev/null)"; then
            echo "Deleted package ${REPOSITORY} (removed last tag '${TAG}')."
            echo "status=deleted" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Failed to delete package ${REPOSITORY}; leaving it in place. ${perr}"
            echo "status=failed" >> "${GITHUB_OUTPUT}"
          fi
        else
          echo "::warning::Failed to delete ${REPOSITORY}:${TAG} (version ${vid}); leaving it in place. ${err}"
          echo "status=failed" >> "${GITHUB_OUTPUT}"
        fi
