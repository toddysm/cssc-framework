[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cssc-graph"
version = "0.1.0"
description = "File-backed supply-chain graph: data schema, validation, and CLI for the CSSC framework."
requires-python = ">=3.11,<3.15"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "ladybug>=0.19",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
cssc-graph = "cssc_graph.cli:main"

[tool.setuptools.packages.find]
include = ["cssc_graph*"]

[tool.setuptools.package-data]
cssc_graph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
