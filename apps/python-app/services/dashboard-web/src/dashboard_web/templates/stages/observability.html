<div class="graph-stage">
  {% if not data.ready %}
  <p class="empty">
    The graph index is not ready yet, or no events have been recorded.
  </p>
  {% else %}
  <p>
    Indexed <strong>{{ data.records }}</strong> event record(s).
    {% if data.by_kind %}
    <span class="badges">
      {% for kind, count in data.by_kind.items() %}
      <span class="badge">{{ kind }}: {{ count }}</span>
      {% endfor %}
    </span>
    {% endif %}
  </p>
  {% endif %}

  <form class="graph-explore"
        hx-get="/graph/neighborhood"
        hx-target="#graph-neighborhood"
        hx-swap="innerHTML">
    <label for="graph-ref">Explore a bounded neighborhood</label>
    <input id="graph-ref" type="text" name="ref"
           placeholder="ghcr.io/toddysm/apps/cssc-dashboard/packages-service:0.1" />
    <input type="hidden" name="depth" value="3" />
    <button type="submit">Show</button>
  </form>

  <div id="graph-neighborhood"></div>

  <form class="graph-explore"
        hx-get="/graph/referrers"
        hx-target="#graph-referrers"
        hx-swap="innerHTML">
    <label for="referrers-ref">List referrer artifacts (SBOM, provenance, VEX, signatures)</label>
    <input id="referrers-ref" type="text" name="ref"
           placeholder="ghcr.io/toddysm/golden/python:3.14-slim" />
    <input type="hidden" name="depth" value="3" />
    <button type="submit">Referrers</button>
  </form>

  <div id="graph-referrers"></div>
</div>
